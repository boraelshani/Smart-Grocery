<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
rel="stylesheet">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
<div class="container">
<a class="navbar-brand fw-bold" href="home.html">Smart Grocery</a>
<button class="navbar-toggler" type="button" data-bs-toggle="collapse"
data-bs-target="#navbarNav">
<span class="navbar-toggler-icon"></span>
</button>
<div class="collapse navbar-collapse" id="navbarNav">
<ul class="navbar-nav ms-auto">
<li class="nav-item"><a class="nav-link" href="home.html">Home</a></li>
<li class="nav-item"><a class="nav-link" href="Stores.html">Stores</a></li>

<li class="nav-item"><a class="nav-link"
href="FeaturedDeals.html">Featured Deals</a></li>

</ul>
</div>

<!-- Sign Up Form -->
<section class="container py-5">
<div class="row justify-content-center">
<div class="col-md-5">
<div class="card shadow-sm">
<div class="card-body">
<h2 class="card-title mb-4 text-center">Sign Up</h2>
<form onsubmit="return redirectHome()">
<div class="mb-3">
<label for="name" class="form-label">Full Name</label>
<input type="text" class="form-control" id="name" placeholder="Enter
full name" required>
</div>
<div class="mb-3">
<label for="email" class="form-label">Email address</label>
<input type="email" class="form-control" id="email" placeholder="Enter
email" required>
</div>
<div class="mb-3">
<label for="password" class="form-label">Password</label>
<input type="password" class="form-control" id="password"
placeholder="Password" required>
</div>
<button type="submit" class="btn btn-primary w-100">Sign Up</button>
</form>
<p class="text-center mt-3">
Already have an account? <a href="login.html">Login</a>
</p>
</div>
</div>
</div>
</div>
</section>

<footer class="text-center py-4 bg-light border-top">
<p class="mb-0 text-muted">&copy; 2025 Smart Grocery Team</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
function redirectHome() {
// For week 1 exercise, just redirect to home
window.location.href = "home.html";
return false; // prevent form from actually submitting
}
</script>
</body>
</html>
