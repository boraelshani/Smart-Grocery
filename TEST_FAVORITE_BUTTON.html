<!DOCTYPE html>
<html>
<head>
    <title>Test Favorite Button</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            padding: 50px;
            font-family: Arial, sans-serif;
        }
        .test-buttons {
            display: flex;
            gap: 1rem;
            align-items: center;
        }
        .btn-add {
            flex: 1;
            height: 52px;
            background: linear-gradient(135deg, #65388f 0%, #7c3aed 100%);
            color: white;
            border: 2px solid #65388f;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .btn-fav {
            width: 52px;
            height: 52px;
            background: white;
            border: 2px solid #e5e7eb;
            color: #65388f;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .btn-fav.favorited {
            border-color: #dc2626;
            color: #dc2626;
        }
        .btn-fav i {
            font-size: 1.25rem;
        }
        #message {
            margin-top: 20px;
            padding: 1rem;
            border-radius: 8px;
            display: none;
        }
        #message.success {
            background: #dcfce7;
            color: #16a34a;
            border: 2px solid #22c55e;
        }
        #message.error {
            background: #fee2e2;
            color: #dc2626;
            border: 2px solid #ef4444;
        }
    </style>
</head>
<body>
    <h1>Test Favorite Button</h1>
    <p>Product ID: 123</p>
    
    <div class="test-buttons">
        <button class="btn-add">
            <i class="bi bi-cart-plus"></i>
            Add to List
        </button>
        <button id="fav-btn" class="btn-fav" onclick="testToggleFavorite('123', this)">
            <i class="bi bi-heart"></i>
        </button>
    </div>
    
    <div id="message"></div>
    
    <script>
        function testToggleFavorite(productId, button) {
            console.log('Button clicked! Product ID:', productId);
            const icon = button.querySelector('i');
            const messageDiv = document.getElementById('message');
            
            // Disable button
            button.disabled = true;
            button.style.opacity = '0.6';
            
            console.log('Sending request to /api/toggle-favorite');
            
            fetch('/api/toggle-favorite', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ product_id: productId })
            })
            .then(response => {
                console.log('Response status:', response.status);
                return response.json();
            })
            .then(data => {
                console.log('Response data:', data);
                
                button.disabled = false;
                button.style.opacity = '1';
                
                if (data.success) {
                    button.classList.toggle('favorited');
                    
                    if (data.is_favorite) {
                        icon.classList.remove('bi-heart');
                        icon.classList.add('bi-heart-fill');
                        button.style.borderColor = '#dc2626';
                        button.style.color = '#dc2626';
                        
                        messageDiv.textContent = 'Added to favorites! ❤️';
                        messageDiv.className = 'success';
                    } else {
                        icon.classList.remove('bi-heart-fill');
                        icon.classList.add('bi-heart');
                        button.style.borderColor = '#e5e7eb';
                        button.style.color = '#65388f';
                        
                        messageDiv.textContent = 'Removed from favorites';
                        messageDiv.className = 'success';
                    }
                    messageDiv.style.display = 'block';
                } else if (data.error === 'unauthorized') {
                    messageDiv.textContent = 'Please log in to add favorites';
                    messageDiv.className = 'error';
                    messageDiv.style.display = 'block';
                } else {
                    messageDiv.textContent = 'Error: ' + (data.error || 'Unknown error');
                    messageDiv.className = 'error';
                    messageDiv.style.display = 'block';
                }
            })
            .catch(err => {
                console.error('Fetch error:', err);
                button.disabled = false;
                button.style.opacity = '1';
                
                messageDiv.textContent = 'Network error: ' + err.message;
                messageDiv.className = 'error';
                messageDiv.style.display = 'block';
            });
        }
    </script>
</body>
</html>
