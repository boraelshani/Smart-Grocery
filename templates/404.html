{% extends "base.html" %}

{% block styles %}
<style>
    body {
      background-color: #f8f9fa;
      font-family: 'Plus Jakarta Sans', sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .error-card {
      max-width: 500px;
      padding: 3rem 2rem;
      border-radius: 1.5rem;
      background: white;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    }
    .error-icon {
      font-size: 5rem;
      color: #7c3aed; /* Premium Purple */
      margin-bottom: 1rem;
    }
    .brand-text {
      font-weight: 700;
      color: #7c3aed;
    }
    .btn-primary {
      background-color: #7c3aed;
      border-color: #7c3aed;
    }
    .btn-primary:hover {
      background-color: #6d28d9;
      border-color: #6d28d9;
    }
  </style>
{% endblock %}

{% block content %}
<div class="container text-center">
    <div class="error-card mx-auto">
      <div class="error-icon">
        <i class="bi bi-basket"></i>
      </div>
      <h1 class="display-1 fw-bold mb-0">404</h1>
      <h2 class="h4 fw-bold mb-3">Aisle Not Found</h2>
      <p class="text-muted mb-4">
        Oops! We looked everywhere but couldn't find the page you're looking for. It might have been moved or removed from stock.
      </p>
      <a href="{{ url_for('main.home') }}" class="btn btn-primary btn-lg rounded-pill px-5 shadow-sm">
        <i class="bi bi-house-door me-2"></i>Return Home
      </a>
      <div class="mt-4 pt-3 border-top">
        <small class="text-muted">Smart<span class="brand-text">Grocery</span></small>
      </div>
    </div>
  </div>
{% endblock %}
