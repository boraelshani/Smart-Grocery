<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Grocery | 404 Not Found</title>
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  
  <style>
    body {
      background-color: #f8f9fa;
      font-family: 'Plus Jakarta Sans', sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .error-card {
      max-width: 500px;
      padding: 3rem 2rem;
      border-radius: 1.5rem;
      background: white;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    }
    .error-icon {
      font-size: 5rem;
      color: #7c3aed; /* Premium Purple */
      margin-bottom: 1rem;
    }
    .brand-text {
      font-weight: 700;
      color: #7c3aed;
    }
    .btn-primary {
      background-color: #7c3aed;
      border-color: #7c3aed;
    }
    .btn-primary:hover {
      background-color: #6d28d9;
      border-color: #6d28d9;
    }
  </style>
</head>
<body>
  <div class="container text-center">
    <div class="error-card mx-auto">
      <div class="error-icon">
        <i class="bi bi-basket"></i>
      </div>
      <h1 class="display-1 fw-bold mb-0">404</h1>
      <h2 class="h4 fw-bold mb-3">Aisle Not Found</h2>
      <p class="text-muted mb-4">
        Oops! We looked everywhere but couldn't find the page you're looking for. It might have been moved or removed from stock.
      </p>
      <a href="{{ url_for('main.home') }}" class="btn btn-primary btn-lg rounded-pill px-5 shadow-sm">
        <i class="bi bi-house-door me-2"></i>Return Home
      </a>
      <div class="mt-4 pt-3 border-top">
        <small class="text-muted">Smart<span class="brand-text">Grocery</span></small>
      </div>
    </div>
  </div>
</body>
</html>
