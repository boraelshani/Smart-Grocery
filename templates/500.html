{% extends "base.html" %}

{% block styles %}
<style>
    /* Internal CSS for this page specifically */
    body {
      background-color: #f8f9fa; /* Light grey background */
      /* Sets the font family */
      font-family: 'Plus Jakarta Sans', sans-serif;
      /* Takes full viewport height */
      height: 100vh;
      /* Uses Flexbox to center objects */
      display: flex;
      /* Centers vertically */
      align-items: center;
      /* Centers horizontally */
      justify-content: center;
    }
    .error-card {
      max-width: 500px; /* Limits the width of the card */
      padding: 3rem 2rem; /* Adds inner space (padding) */
      border-radius: 1.5rem; /* Rounds the corners */
      background: white; /* White background for the card */
      box-shadow: 0 10px 30px rgba(0,0,0,0.05); /* Soft outer shadow */
    }
    .error-icon {
      font-size: 5rem; /* Extra large icon size */
      color: #dc3545; /* Bootstrap Danger Red for errors */
      margin-bottom: 1rem; /* Space below the icon */
    }
    .brand-text {
      font-weight: 700; /* Bold text for branding */
      color: #7c3aed; /* Theme purple color */
    }
  </style>
{% endblock %}

{% block content %}
<!-- The visible part of the webpage -->
  <div class="container text-center"> <!-- A Bootstrap container that centers all text inside -->
    <div class="error-card mx-auto"> <!-- The white box container, centered with mx-auto -->
      <div class="error-icon"> <!-- Container for the error icon -->
        <i class="bi bi-exclamation-octagon-fill"></i> <!-- The specific exclamation icon tag -->
      </div>
      <h1 class="display-1 fw-bold mb-0">500</h1> <!-- Large '500' title with bold font -->
      <h2 class="h4 fw-bold mb-3">Something Went Wrong</h2> <!-- Subtitle explaining the error -->
      <p class="text-muted mb-4"> <!-- Greyed out (muted) text for the description -->
        We're having trouble connecting to our shelves right now. Our engineering team has been notified and is fixing the spill in Aisle 5.
      </p>
      <a href="{{ url_for('main.home') }}" class="btn btn-outline-dark btn-lg rounded-pill px-5 shadow-sm"> <!-- Button link back to home -->
        <i class="bi bi-arrow-clockwise me-2"></i>Try Again <!-- Icon and text inside the button -->
      </a>
      <div class="mt-4 pt-3 border-top"> <!-- A divider line at the bottom -->
        <small class="text-muted">Smart<span class="brand-text">Grocery</span></small> <!-- Small branding text -->
      </div>
    </div>
  </div>
{% endblock %}
