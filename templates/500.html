<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Grocery | 500 Server Error</title>

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

  <style>
    body {
      background-color: #f8f9fa;
      font-family: 'Plus Jakarta Sans', sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .error-card {
      max-width: 500px;
      padding: 3rem 2rem;
      border-radius: 1.5rem;
      background: white;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    }
    .error-icon {
      font-size: 5rem;
      color: #dc3545; /* Bootstrap Danger Red for errors */
      margin-bottom: 1rem;
    }
    .brand-text {
      font-weight: 700;
      color: #7c3aed;
    }
  </style>
</head>
<body>
  <div class="container text-center">
    <div class="error-card mx-auto">
      <div class="error-icon">
        <i class="bi bi-exclamation-octagon-fill"></i>
      </div>
      <h1 class="display-1 fw-bold mb-0">500</h1>
      <h2 class="h4 fw-bold mb-3">Something Went Wrong</h2>
      <p class="text-muted mb-4">
        We're having trouble connecting to our shelves right now. Our engineering team has been notified and is fixing the spill in Aisle 5.
      </p>
      <a href="{{ url_for('main.home') }}" class="btn btn-outline-dark btn-lg rounded-pill px-5 shadow-sm">
        <i class="bi bi-arrow-clockwise me-2"></i>Try Again
      </a>
      <div class="mt-4 pt-3 border-top">
        <small class="text-muted">Smart<span class="brand-text">Grocery</span></small>
      </div>
    </div>
  </div>
</body>
</html>
