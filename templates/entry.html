{% extends "base.html" %}

{% block styles %}
<style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      overflow-x: hidden;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #8b5cf6 100%);
      position: relative;
    }

    /* Background Pattern */
    .bg-pattern {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: radial-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 1px);
      background-size: 30px 30px;
      opacity: 0.3;
      z-index: 0;
    }

    /* Floating Shapes */
    .shape {
      position: absolute;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(5px);
      border-radius: 50%;
      z-index: 0;
      animation: float 20s infinite ease-in-out;
    }
    .shape-1 { width: 300px; height: 300px; top: -100px; right: -50px; animation-delay: 0s; }
    .shape-2 { width: 200px; height: 200px; bottom: 50px; left: -50px; animation-delay: -5s; }
    .shape-3 { width: 100px; height: 100px; top: 40%; left: 20%; animation-delay: -10s; background: rgba(255, 255, 255, 0.05); }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(10deg); }
    }

    /* Content Container */
    .glass-card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 30px;
      padding: 3.5rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      position: relative;
      z-index: 10;
      border: 1px solid rgba(255, 255, 255, 0.5);
      max-width: 500px;
      width: 100%;
      text-align: center;
      transition: transform 0.3s ease;
    }

    .brand-icon {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 2rem;
      color: white;
      font-size: 2.5rem;
      box-shadow: 0 10px 20px rgba(124, 58, 237, 0.3);
      transform: rotate(-5deg);
    }

    .main-title {
      font-weight: 800;
      color: #1e1b4b;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }

    .subtitle {
      color: #64748b;
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 2.5rem;
    }

    .action-btn {
      display: block;
      width: 100%;
      padding: 1rem;
      border-radius: 16px;
      font-weight: 600;
      font-size: 1.1rem;
      margin-bottom: 1rem;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .btn-login {
      background: #7c3aed;
      color: white;
      border: none;
      box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3);
    }
    .btn-login:hover { 
      background: #6d28d9; 
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(124, 58, 237, 0.4);
      color: white;
    }

    .btn-signup {
      background: white;
      color: #1e1b4b;
      border: 2px solid #e2e8f0;
    }
    .btn-signup:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
      transform: translateY(-2px);
      color: #1e1b4b;
    }

    .footer-text {
      font-size: 0.9rem;
      color: #94a3b8;
      margin-top: 2rem;
    }
  </style>
{% endblock %}

{% block navbar %}{% endblock %}

{% block content %}
<div class="bg-pattern"></div> <!-- Renders the background decorative pattern -->
  <div class="shape shape-1"></div> <!-- Floating decorative circle 1 -->
  <div class="shape shape-2"></div> <!-- Floating decorative circle 2 -->
  <div class="shape shape-3"></div> <!-- Floating decorative circle 3 -->

  <!-- Top Left Logo -->
  <div style="position: absolute; top: 1.5rem; left: 1.5rem; z-index: 100;">
    <a href="{{ url_for('main.home') }}" style="text-decoration: none; display: flex; align-items: center; gap: 0.5rem; font-weight: bold; font-size: 1.25rem; color: #fff;">
        <svg viewBox="0 0 64 64" aria-hidden="true" style="width: 28px; height: 28px; border-radius: 8px; flex: 0 0 auto;">
          <defs>
            <linearGradient id="entry-brand-bg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#f97316"/>
              <stop offset="100%" stop-color="#0ea5a3"/>
            </linearGradient>
            <linearGradient id="entry-brand-leaf" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#22c55e"/>
              <stop offset="100%" stop-color="#16a34a"/>
            </linearGradient>
          </defs>
          <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#entry-brand-bg)"/>
          <path d="M32 12c-8.3 0-15 6.7-15 15 0 10.8 13.1 22.7 14.2 23.7a1.2 1.2 0 0 0 1.6 0C33.9 49.7 47 37.8 47 27c0-8.3-6.7-15-15-15z" fill="#ffffff"/>
          <path d="M32.2 20.5c4.6-3.6 9.1-2.1 11.4 1.2-4 3.3-8.9 4.2-12.6 2.9-1.9 1.4-3.3 3.6-4 6.2 1.2.4 2.6.6 4 .6 4 0 7.5-1.4 10.1-3.7-.3 6.6-4.3 11.4-10.3 11.4-5.9 0-10.8-4.4-10.8-10.2 0-5.6 4.7-10.2 10.7-10.2.5 0 1 0 1.5.1z" fill="url(#entry-brand-leaf)"/>
          <circle cx="46.5" cy="16.5" r="2.3" fill="#ffffff" opacity="0.95"/>
        </svg>
        Smart Grocery
    </a>
  </div>

  <div class="container d-flex justify-content-center align-items-center px-3 min-vh-100 pt-5"> <!-- Bootstrap container: centers content vertically and horizontally -->
      <div class="glass-card mt-5"> <!-- White elevated box with transparency effects, pushed down from navbar -->
        <div class="brand-icon"> <!-- Container for the main brand icon -->
          <i class="bi bi-basket2-fill"></i> <!-- Shopping basket icon from Bootstrap -->
        </div>
        
        <h1 class="main-title display-5">Smart Grocery</h1> <!-- Main title with large 'display-5' typography -->
        <p class="subtitle"> <!-- Description text explaining the app's purpose -->
          Compare prices, track deals, and optimize your grocery shopping in one smart place.
        </p>
        
        <div class="d-grid gap-2"> <!-- Bootstrap 'd-grid': stacks the following links like vertical buttons -->
          <a href="{{ url_for('auth.login') }}" class="action-btn btn-login"> <!-- Link to login page with custom 'btn-login' styles -->
            Log In
          </a>
          <a href="{{ url_for('auth.signup') }}" class="action-btn btn-signup"> <!-- Link to signup page with custom 'btn-signup' styles -->
            Create Account
          </a>
        </div>
        
        <p class="footer-text"> <!-- Small footer text at the bottom of the card -->
          <i class="bi bi-shield-lock me-1"></i> Secure & Private <!-- Locking icon for trust -->
        </p>
      </div>
  </div>
{% endblock %}
