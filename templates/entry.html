<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Welcome - Smart Grocery</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="d-flex align-items-center" style="min-height:100vh;">
  <div class="container text-center py-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm">
          <div class="card-body">
            <h1 class="h3 mb-3">Welcome to Smart Grocery</h1>
            <p class="text-muted mb-4">Sign in or create an account to start saving on groceries.</p>
            <div class="d-flex justify-content-center gap-3">
              <a href="{{ url_for('auth.login') }}" class="btn btn-primary btn-lg">Log In</a>
              <a href="{{ url_for('auth.signup') }}" class="btn btn-outline-primary btn-lg">Sign Up</a>
            </div>
            <p class="small text-muted mt-4">You can browse, but to save items to your list please sign in.</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
