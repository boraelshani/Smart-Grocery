<!--
═══════════════════════════════════════════════════════════════════════════
ENTRY PAGE (First Screen - Before Login)
═══════════════════════════════════════════════════════════════════════════
Purpose: Landing page shown when user is NOT logged in
Features:
- Premium welcoming UI
- Two buttons: "Log In" and "Sign Up"
- User must authenticate before accessing the main application
- Shown at route: /entry
═══════════════════════════════════════════════════════════════════════════
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Welcome - Smart Grocery</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      overflow-x: hidden;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #8b5cf6 100%);
      position: relative;
    }

    /* Background Pattern */
    .bg-pattern {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: radial-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 1px);
      background-size: 30px 30px;
      opacity: 0.3;
      z-index: 0;
    }

    /* Floating Shapes */
    .shape {
      position: absolute;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(5px);
      border-radius: 50%;
      z-index: 0;
      animation: float 20s infinite ease-in-out;
    }
    .shape-1 { width: 300px; height: 300px; top: -100px; right: -50px; animation-delay: 0s; }
    .shape-2 { width: 200px; height: 200px; bottom: 50px; left: -50px; animation-delay: -5s; }
    .shape-3 { width: 100px; height: 100px; top: 40%; left: 20%; animation-delay: -10s; background: rgba(255, 255, 255, 0.05); }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(10deg); }
    }

    /* Content Container */
    .glass-card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 30px;
      padding: 3.5rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      position: relative;
      z-index: 10;
      border: 1px solid rgba(255, 255, 255, 0.5);
      max-width: 500px;
      width: 100%;
      text-align: center;
      transition: transform 0.3s ease;
    }

    .brand-icon {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 2rem;
      color: white;
      font-size: 2.5rem;
      box-shadow: 0 10px 20px rgba(124, 58, 237, 0.3);
      transform: rotate(-5deg);
    }

    .main-title {
      font-weight: 800;
      color: #1e1b4b;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }

    .subtitle {
      color: #64748b;
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 2.5rem;
    }

    .action-btn {
      display: block;
      width: 100%;
      padding: 1rem;
      border-radius: 16px;
      font-weight: 600;
      font-size: 1.1rem;
      margin-bottom: 1rem;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .btn-login {
      background: #7c3aed;
      color: white;
      border: none;
      box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3);
    }
    .btn-login:hover { 
      background: #6d28d9; 
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(124, 58, 237, 0.4);
      color: white;
    }

    .btn-signup {
      background: white;
      color: #1e1b4b;
      border: 2px solid #e2e8f0;
    }
    .btn-signup:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
      transform: translateY(-2px);
      color: #1e1b4b;
    }

    .footer-text {
      font-size: 0.9rem;
      color: #94a3b8;
      margin-top: 2rem;
    }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center">
  
  <div class="bg-pattern"></div> <!-- Renders the background decorative pattern -->
  <div class="shape shape-1"></div> <!-- Floating decorative circle 1 -->
  <div class="shape shape-2"></div> <!-- Floating decorative circle 2 -->
  <div class="shape shape-3"></div> <!-- Floating decorative circle 3 -->

  <div class="container d-flex justify-content-center px-3"> <!-- Bootstrap container: centers content, adds horizontal padding -->
      <div class="glass-card"> <!-- White elevated box with transparency effects -->
        <div class="brand-icon"> <!-- Container for the main brand icon -->
          <i class="bi bi-basket2-fill"></i> <!-- Shopping basket icon from Bootstrap -->
        </div>
        
        <h1 class="main-title display-5">Smart Grocery</h1> <!-- Main title with large 'display-5' typography -->
        <p class="subtitle"> <!-- Description text explaining the app's purpose -->
          Compare prices, track deals, and optimize your grocery shopping in one smart place.
        </p>
        
        <div class="d-grid gap-2"> <!-- Bootstrap 'd-grid': stacks the following links like vertical buttons -->
          <a href="{{ url_for('auth.login') }}" class="action-btn btn-login"> <!-- Link to login page with custom 'btn-login' styles -->
            Log In
          </a>
          <a href="{{ url_for('auth.signup') }}" class="action-btn btn-signup"> <!-- Link to signup page with custom 'btn-signup' styles -->
            Create Account
          </a>
        </div>
        
        <p class="footer-text"> <!-- Small footer text at the bottom of the card -->
          <i class="bi bi-shield-lock me-1"></i> Secure & Private <!-- Locking icon for trust -->
        </p>
      </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
