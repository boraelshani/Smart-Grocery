<!--
═══════════════════════════════════════════════════════════════════════════
LOGIN PAGE (User Authentication)
═══════════════════════════════════════════════════════════════════════════
Purpose: User authentication form for existing accounts
Features:
- Email input field
- Password input field
- Form validation (email format, password required)
- Error messages for invalid credentials
- Link to signup page for new users
- Remember me functionality option
Route: POST /login
Validates: Email and password against database with hashed passwords
═══════════════════════════════════════════════════════════════════════════
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Grocery | Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
<div class="container">
<a class="navbar-brand fw-bold" href="{{ url_for('main.home') }}" style="font-size: 1.5rem; color: #667eea;">
<i class="bi bi-cart-check-fill me-2"></i>Smart Grocery
</a>
<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
<span class="navbar-toggler-icon"></span>
</button>
<div class="collapse navbar-collapse" id="navbarNav">
<ul class="navbar-nav ms-auto">
<li class="nav-item"><a class="nav-link" href="{{ url_for('main.home') }}"><i class="bi bi-house-door"></i> Home</a></li>
<li class="nav-item"><a class="nav-link" href="{{ url_for('main.stores_page') }}"><i class="bi bi-shop"></i> Stores</a></li>
<li class="nav-item"><a class="nav-link" href="{{ url_for('main.featured_deals_page') }}"><i class="bi bi-tags"></i> Deals</a></li>
<li class="nav-item"><a class="nav-link" href="{{ url_for('main.compare_prices') }}"><i class="bi bi-bar-chart"></i> Compare</a></li>
<li class="nav-item">
<a class="nav-link position-relative" href="{{ url_for('main.shopping_list') }}">
<i class="bi bi-list-check"></i> Lists
<span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="font-size: 0.65rem;">
0
</span>
</a>
</li>
<li class="nav-item"><a class="nav-link" href="{{ url_for('main.notifications_page') }}"><i class="bi bi-bell"></i> Notifications</a></li>
<li class="nav-item"><a class="nav-link" href="{{ url_for('main.profile') }}">
<i class="bi bi-person-circle"></i> Profile
</a></li>
</ul>
</div>
</div>
</nav>

<!-- Login Form -->
<section class="container py-5">
<div class="row justify-content-center">
<div class="col-md-5">
<div class="card shadow-sm">
<div class="card-body">
<h2 class="card-title mb-4 text-center">Login</h2>
	{% if error %}
	<div class="alert alert-danger" role="alert">{{ error }}</div>
	{% endif %}
<form method="post" action="{{ url_for('auth.login') }}">
<div class="mb-3">
<label for="email" class="form-label">Email address</label>
		<input type="email" class="form-control" id="email" name="email" placeholder="Enter email" value="{{ email or request.form.get('email','') }}" required>
</div>
<div class="mb-3">
<label for="password" class="form-label">Password</label>
<input type="password" class="form-control" id="password" name="password" placeholder="Password" required>
</div>
<button type="submit" class="btn btn-primary w-100">Login</button>
</form>
<p class="text-center mt-3">
Don't have an account? <a href="{{ url_for('auth.signup') }}">Sign Up</a>
</p>
</div>
</div>
</div>
</div>
</section>

<footer class="text-center py-4 bg-light border-top">
<p class="mb-0 text-muted">&copy; 2025 Smart Grocery Team</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
