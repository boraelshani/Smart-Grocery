<body>
<!-- Navbar -->

<div class="container">

<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
<span class="navbar-toggler-icon"></span>
</button>
<div class="collapse navbar-collapse" id="navbarNav">
<ul class="navbar-nav ms-auto">
<li class="nav-item">
<a class="nav-link active" href="{{ url_for('home') }}">Home</a>
</li>
<li class="nav-item">
<a class="nav-link" href="{{ url_for('stores') }}">Stores</a>

<li class="nav-item">

<li class="nav-item">

</li>

</div>

<!-- Shopping List -->
<section class="container py-5">
<h1 class="mb-4">My Shopping List</h1>

<div class="list-group mb-4">
<div class="list-group-item d-flex justify-content-between align-items-center">
<div>
<h5 class="mb-1">Organic Bananas</h5>
<small class="text-muted">Best price: $2.99 at FreshMart</small>
</div>
<div class="d-flex align-items-center gap-2">
<input type="number" value="1" class="form-control form-control-sm" style="width:60px">
<button class="btn btn-danger btn-sm">Remove</button>
</div>
</div>

<div class="list-group-item d-flex justify-content-between align-items-center">
<div>
<h5 class="mb-1">Whole Milk 1 Gallon</h5>
<small class="text-muted">Best price: $4.49 at FreshMart</small>
</div>
<div class="d-flex align-items-center gap-2">
<input type="number" value="1" class="form-control form-control-sm" style="width:60px">
<button class="btn btn-danger btn-sm">Remove</button>
</div>
</div>

<div class="list-group-item d-flex justify-content-between align-items-center">
<div>
<h5 class="mb-1">Chicken Breast 2lb</h5>
<small class="text-muted">Best price: $8.99 at FreshMart</small>
</div>
<div class="d-flex align-items-center gap-2">
<input type="number" value="1" class="form-control form-control-sm" style="width:60px">
<button class="btn btn-danger btn-sm">Remove</button>
</div>
</div>
</div>

<div class="text-end">
<h5>Total: $16.47</h5>
<button class="btn btn-primary">Checkout</button>
</div>
</section>
